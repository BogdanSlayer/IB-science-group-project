<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocChat — Ask your documents anything</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #6c63ff;
      --accent-dim:#3d3880;
      --text:      #e8e9f0;
      --muted:     #6b7280;
      --success:   #22c55e;
      --error:     #ef4444;
      --radius:    12px;
      --font:      'Inter', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--accent-dim);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ── Main layout ── */
    main {
      width: 100%;
      max-width: 780px;
      padding: 40px 24px 100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Upload zone ── */
    #upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    #upload-zone:hover, #upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(108, 99, 255, 0.05);
    }
    #upload-zone.has-file {
      border-style: solid;
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.05);
    }
    #file-input { display: none; }
    .upload-icon { font-size: 2rem; margin-bottom: 12px; }
    .upload-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
    .upload-sub { font-size: 0.85rem; color: var(--muted); }
    #file-status {
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--success);
      display: none;
    }
    #upload-btn {
      margin-top: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #upload-btn:hover { opacity: 0.85; }
    #upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Chat ── */
    #chat-section { display: none; flex-direction: column; gap: 16px; }
    #chat-section.visible { display: flex; }

    .doc-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .doc-pill strong { color: var(--text); }
    .doc-pill button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0;
      line-height: 1;
    }
    .doc-pill button:hover { color: var(--error); }

    #chat-window {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      min-height: 300px;
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.ai   { align-self: flex-start; }

    .msg-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.ai .msg-bubble {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 3px;
    }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 8px;
      text-align: center;
    }
    #empty-state .icon { font-size: 2rem; }
    #empty-state p { font-size: 0.88rem; }

    /* ── Input ── */
    .input-row {
      display: flex;
      gap: 10px;
    }
    #question-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.92rem;
      color: var(--text);
      font-family: var(--font);
      resize: none;
      min-height: 48px;
      max-height: 140px;
      outline: none;
      transition: border-color 0.2s;
    }
    #question-input::placeholder { color: var(--muted); }
    #question-input:focus { border-color: var(--accent); }

    #ask-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    #ask-btn:hover { opacity: 0.85; }
    #ask-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Suggestions */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .suggestion-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .suggestion-chip:hover { border-color: var(--accent); color: var(--text); }

    #error-msg {
      color: var(--error);
      font-size: 0.85rem;
      display: none;
    }

    @media (max-width: 600px) {
      header { padding: 16px; }
      main { padding: 24px 16px 80px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Doc<span>Chat</span></div>
  <div class="badge">Powered by Claude</div>
</header>

<main>

  <!-- Upload zone -->
  <div id="upload-zone">
    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt" />
    <div class="upload-icon">📄</div>
    <div class="upload-title">Drop your file here or click to browse</div>
    <div class="upload-sub">Supports PDF, Word (.docx), and plain text — up to 20 MB</div>
    <div id="file-status"></div>
    <button id="upload-btn" disabled>Upload &amp; Analyse</button>
  </div>

  <div id="error-msg"></div>

  <!-- Chat section -->
  <div id="chat-section">
    <div class="doc-pill">
      📎 <strong id="doc-name"></strong>
      <button id="clear-btn" title="Upload a different file">✕</button>
    </div>

    <div id="chat-window">
      <div id="empty-state">
        <div class="icon">💬</div>
        <p>Ask anything about your document</p>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="suggestion-chip">Summarise this document</button>
      <button class="suggestion-chip">What are the key points?</button>
      <button class="suggestion-chip">List any dates or deadlines</button>
      <button class="suggestion-chip">Who are the main people mentioned?</button>
    </div>

    <div class="input-row">
      <textarea
        id="question-input"
        placeholder="Ask a question about your document…"
        rows="1"
      ></textarea>
      <button id="ask-btn" disabled>➤</button>
    </div>
  </div>

</main>

<script>
  let sessionId = null;

  const uploadZone  = document.getElementById("upload-zone");
  const fileInput   = document.getElementById("file-input");
  const fileStatus  = document.getElementById("file-status");
  const uploadBtn   = document.getElementById("upload-btn");
  const chatSection = document.getElementById("chat-section");
  const chatWindow  = document.getElementById("chat-window");
  const emptyState  = document.getElementById("empty-state");
  const docName     = document.getElementById("doc-name");
  const clearBtn    = document.getElementById("clear-btn");
  const questionInput = document.getElementById("question-input");
  const askBtn      = document.getElementById("ask-btn");
  const errorMsg    = document.getElementById("error-msg");
  const suggestions = document.getElementById("suggestions");

  // ── Drag & drop ──────────────────────────────────────────────────────────
  uploadZone.addEventListener("click", (e) => {
    if (e.target !== uploadBtn) fileInput.click();
  });
  uploadZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    uploadZone.classList.add("drag-over");
  });
  uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("drag-over"));
  uploadZone.addEventListener("drop", (e) => {
    e.preventDefault();
    uploadZone.classList.remove("drag-over");
    if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) selectFile(fileInput.files[0]);
  });

  function selectFile(file) {
    fileStatus.textContent = `✓ ${file.name}`;
    fileStatus.style.display = "block";
    uploadZone.classList.add("has-file");
    uploadBtn.disabled = false;
    fileInput._selectedFile = file;
    hideError();
  }

  // ── Upload ────────────────────────────────────────────────────────────────
  uploadBtn.addEventListener("click", async () => {
    const file = fileInput._selectedFile || fileInput.files[0];
    if (!file) return;

    uploadBtn.disabled = true;
    uploadBtn.innerHTML = `<span class="spinner"></span>Processing…`;

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || "Upload failed.");

      sessionId = data.sessionId;
      docName.textContent = data.filename;
      chatSection.classList.add("visible");
      askBtn.disabled = false;
      uploadZone.style.display = "none";
      hideError();
    } catch (err) {
      showError(err.message);
    } finally {
      uploadBtn.innerHTML = "Upload &amp; Analyse";
      uploadBtn.disabled = false;
    }
  });

  // ── Clear / reset ─────────────────────────────────────────────────────────
  clearBtn.addEventListener("click", async () => {
    if (sessionId) {
      fetch(`/session/${sessionId}`, { method: "DELETE" }).catch(() => {});
      sessionId = null;
    }
    chatSection.classList.remove("visible");
    uploadZone.style.display = "";
    uploadZone.classList.remove("has-file");
    fileStatus.style.display = "none";
    uploadBtn.disabled = true;
    fileInput.value = "";
    fileInput._selectedFile = null;
    chatWindow.innerHTML = `<div id="empty-state">
      <div class="icon">💬</div>
      <p>Ask anything about your document</p>
    </div>`;
    askBtn.disabled = true;
    hideError();
  });

  // ── Suggestions ───────────────────────────────────────────────────────────
  suggestions.addEventListener("click", (e) => {
    if (e.target.classList.contains("suggestion-chip")) {
      questionInput.value = e.target.textContent;
      sendQuestion();
    }
  });

  // ── Question input ────────────────────────────────────────────────────────
  questionInput.addEventListener("input", () => {
    questionInput.style.height = "auto";
    questionInput.style.height = questionInput.scrollHeight + "px";
  });
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });
  askBtn.addEventListener("click", sendQuestion);

  // ── Send & stream ─────────────────────────────────────────────────────────
  async function sendQuestion() {
    const question = questionInput.value.trim();
    if (!question || !sessionId) return;

    // Remove empty state
    const es = document.getElementById("empty-state");
    if (es) es.remove();

    appendMessage("user", question);
    questionInput.value = "";
    questionInput.style.height = "auto";
    askBtn.disabled = true;
    hideError();

    const aiBubble = appendMessage("ai", "");
    const bubbleEl = aiBubble.querySelector(".msg-bubble");
    bubbleEl.textContent = "▌";

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, question }),
      });

      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || "Request failed.");
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          try {
            const payload = JSON.parse(line.slice(6));
            if (payload.error) throw new Error(payload.error);
            if (payload.chunk) {
              fullText += payload.chunk;
              bubbleEl.textContent = fullText + "▌";
              chatWindow.scrollTop = chatWindow.scrollHeight;
            }
            if (payload.done) {
              bubbleEl.textContent = fullText;
            }
          } catch (_) {}
        }
      }

      if (!fullText) bubbleEl.textContent = "(No response)";
      else bubbleEl.textContent = fullText;

    } catch (err) {
      bubbleEl.textContent = "⚠ " + err.message;
      bubbleEl.style.color = "var(--error)";
    } finally {
      askBtn.disabled = false;
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }
  }

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="msg-label">${role === "user" ? "You" : "Claude"}</div>
      <div class="msg-bubble">${escapeHtml(text)}</div>
    `;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function showError(msg) {
    errorMsg.textContent = "⚠ " + msg;
    errorMsg.style.display = "block";
  }
  function hideError() {
    errorMsg.style.display = "none";
  }
</script>

</body>
</html>
